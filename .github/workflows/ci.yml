name: Plugin checks
permissions:
  contents: read
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-package-node-${{ matrix.node }}
          path: '*.tgz'
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: plugin-package-node-24
          path: dist
      - name: Verify release files and prepare source archive
        run: node scripts/release-assets.mjs --directory dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.tgz dist/*-source.zip
          dist/SHA256SUMS.txt dist/release-manifest.json
          --verify-tag --latest --title "$RELEASE_TAG"
          --notes-file dist/RELEASE_NOTES.md
